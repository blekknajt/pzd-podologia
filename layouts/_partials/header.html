<header class="site-header" id="top">
  <div class="container header-inner">
    <a class="brand-link" href="{{ "/" | relURL }}">
      {{ partial "brand-logo.html" . }}
    </a>

    <nav class="site-nav" id="primary-nav" aria-label="Nawigacja główna">
      <ul class="nav-list">
        {{- $currentRel := .RelPermalink -}}
        {{- range site.Menus.main }}
          {{- $isActive := eq $currentRel .URL -}}
          <li>
            <a href="{{ .URL | relURL }}" class="nav-link{{ if $isActive }} is-active{{ end }}"{{ if $isActive }} aria-current="page"{{ end }}>
              {{ .Name }}
            </a>
          </li>
        {{- end }}
      </ul>
      <div class="nav-mobile-cta">
        <a href="tel:{{ site.Params.contact.phoneHref }}" class="btn btn-primary btn-block">
          Zadzwoń: {{ site.Params.contact.phoneDisplay }}
        </a>
      </div>
    </nav>

    <div class="header-actions">
      <a href="tel:{{ site.Params.contact.phoneHref }}" class="btn btn-primary btn-sm">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span>Umów wizytę</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Otwórz menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
    </div>
  </div>
</header>
