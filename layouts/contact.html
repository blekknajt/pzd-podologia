{{ define "main" }}
<section class="page-hero">
  <div class="container">
    {{- with .Params.eyebrow }}<p class="eyebrow">{{ . }}</p>{{ end }}
    <h1 class="page-title">{{ .Title }}</h1>
    {{- with .Params.lead }}<p class="page-lead">{{ . }}</p>{{ end }}
  </div>
</section>

<section class="section section--surface">
  <div class="container">
    {{ partial "contact-block.html" . }}
  </div>
</section>
{{ end }}
