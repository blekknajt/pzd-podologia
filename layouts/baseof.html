<!DOCTYPE html>
<html lang="pl">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-inner{{ end }}">
  <a class="skip-link" href="#main-content">Przejdź do treści głównej</a>

  {{ partial "header.html" . }}

  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <dialog class="lightbox" id="image-lightbox" aria-label="Podgląd zdjęcia terapii">
    <div class="lightbox-inner">
      <button type="button" class="lightbox-close" aria-label="Zamknij podgląd">&times;</button>
      <img class="lightbox-img" src="" alt="">
      <p class="lightbox-caption"></p>
    </div>
  </dialog>

  {{- $js := resources.Get "js/main.js" -}}
  {{- if not hugo.IsServer -}}
    {{- $js = $js | resources.Minify | resources.Fingerprint -}}
  {{- end -}}
  <script src="{{ $js.RelPermalink }}"{{ if not hugo.IsServer }} integrity="{{ $js.Data.Integrity }}"{{ end }} defer></script>
</body>
</html>
