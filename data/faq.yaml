- question: "Gdzie dokładnie znajduje się gabinet PZD Podologia?"
  answer: "Gabinet mieści się pod adresem Budziechów 88, 68-300 Lubsko — w dobrze znanym lokalnie budynku studia fizjoterapii i treningu „Dobry Ruch”. Dojazd z Lubska zajmuje zaledwie kilka minut."

- question: "Jak mogę umówić się na wizytę?"
  answer: "Wizytę można zarezerwować telefonicznie pod numerem +48 663 352 327, mailowo (pzd.podologia@gmail.com) lub przez wiadomość na Facebooku albo Instagramie (@pzd.podologia). Ponieważ przyjmuję również pacjentów w Zielonej Górze, podczas zabiegów mogę nie odebrać telefonu — zawsze oddzwaniam najszybciej jak to możliwe."

- question: "Jak przygotować się do pierwszej wizyty podologicznej?"
  answer: "Przed wizytą wystarczy standardowo umyć stopy — nie mocz ich długo, nie ścieraj tarką i nie próbuj samodzielnie wycinać odcisków ani wrastających paznokci. Warto zmyć lakier z paznokci i przygotować informację o chorobach przewlekłych (np. cukrzyca, choroby krążenia, alergie), przyjmowanych lekach oraz ewentualnej ciąży."

- question: "Czy warto wcześniej użyć aptecznych plastrów lub maści na odciski?"
  answer: "Zdecydowanie odradzam. Apteczne plastry i maści zawierają wysokie stężenia kwasu salicylowego, który działa nie tylko na odcisk, ale także rozpuszcza i podrażnia zdrową skórę wokół niego — często powodując jeszcze większy ból przy chodzeniu. Bezpieczniej usunąć odcisk w gabinecie podologicznym."

- question: "Jak dbacie o sterylność i bezpieczeństwo zabiegów?"
  answer: "Gabinet spełnia wszelkie wymogi sanitarne. Stosujemy materiały jednorazowe, a wszystkie narzędzia wielokrotnego użytku przechodzą pełną procedurę mycia, dezynfekcji oraz sterylizacji w autoklawie klasy B."

- question: "Jakie są zasady spóźnień, odwoływania wizyt i płatności?"
  answer: "Zgodnie z regulaminem gabinetu prosimy o odwołanie lub zmianę terminu najpóźniej 24 godziny przed wizytą. Dopuszczalne spóźnienie wynosi 10 minut. Za zabiegi można zapłacić gotówką lub BLIKiem. Osoby niepełnoletnie przyjmowane są za zgodą i w obecności rodzica lub opiekuna prawnego."

- question: "Czy podolog zajmuje się również paznokciami dłoni?"
  answer: "Tak — podologia obejmuje dysfunkcje aparatu paznokciowego zarówno stóp, jak i dłoni. Pomagam m.in. przy paznokciach dłoni po urazach mechanicznych, naderwaniach, krwiakach czy uszkodzeniach po stylizacji."
