- question: "Jak mogę umówić się na wizytę w gabinecie PZD Podologia?"
  answer: "Wizytę można zarezerwować telefonicznie pod numerem +48 663 352 327, mailowo (pzd.podologia@gmail.com) lub wysyłając wiadomość prywatną na naszym profilu na Facebooku albo Instagramie (@pzd.podologia). Gabinet jest otwarty od poniedziałku do piątku w godzinach 09:00–20:00 oraz w soboty 09:00–13:00."

- question: "Jak przygotować się do pierwszej wizyty podologicznej?"
  answer: "Przed wizytą wystarczy standardowo umyć stopy — nie należy ich wcześniej długo moczyć, ścierać tarką ani samodzielnie wycinać bolesnych odcisków czy wrastających paznokci. Jeśli na paznokciach jest lakier hybrydowy lub klasyczny, warto go usunąć przed zabiegiem. W przypadku chorób przewlekłych (np. cukrzycy) lub przyjmowanych leków dobrze mieć ich listę."

- question: "Czy zabiegi podologiczne są bolesne?"
  answer: "Zabiegi podologiczne są wykonywane delikatnie, z pełnym poszanowaniem komfortu pacjenta i w zdecydowanej większości są całkowicie bezbolesne. Nawet przy bolesnych pęknięciach pięt, odciskach czy wrastających paznokciach celem wizyty jest przyniesienie szybkiej i bezpiecznej ulgi."

- question: "Jak dbacie o sterylność i bezpieczeństwo narzędzi?"
  answer: "Bezpieczeństwo pacjentów to absolutny priorytet. W gabinecie stosowane są jednorazowe materiały zabiegowe, a wszystkie narzędzia wielokrotnego użytku przechodzą pełny proces dezynfekcji oraz sterylizacji w autoklawie medycznym i są otwierane z pakietu sterylnego przy pacjencie."

- question: "Jakie formy płatności są dostępne w gabinecie?"
  answer: "W gabinecie PZD Podologia możliwa jest płatność gotówką oraz za pomocą systemu BLIK."

- question: "Co w przypadku spóźnienia lub konieczności odwołania wizyty?"
  answer: "Zgodnie z regulaminem gabinetu prosimy o informację o odwołaniu lub przełożeniu wizyty najpóźniej 24 godziny przed umówionym terminem. Tolerancja spóźnienia wynosi 15 minut — w przypadku większego opóźnienia wykonanie pełnego zabiegu może nie być możliwe."

- question: "Czy osoby chore na cukrzycę powinny regularnie odwiedzać podologa?"
  answer: "Tak — w przypadku cukrzycy profilaktyka stóp jest kluczowa. Nawet drobne otarcie, pęknięcie naskórka czy źle obcięty paznokieć mogą prowadzić do poważnych powikłań. Regularne, delikatne kontrole podologiczne i codzienna obserwacja stóp pomagają bezpiecznie zadbać o zdrowie."
