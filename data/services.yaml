- id: "wrastajace-paznokcie"
  category: "Ulubiona specjalność"
  title: "Wrastające paznokcie i ortonyksja"
  price: "180 – 220 zł"
  summary: "Korekcja paznokci wrastających i wkręcających się oraz wyciszanie stanów zapalnych wałów okołopaznokciowych. Nie każdy stan zapalny wymaga klamry — zawsze dobieram najmniej inwazyjną, skuteczną metodę."
  details:
    - "Wycięcie elementu drażniącego, tamponada, tejp i opatrunek (200 zł)"
    - "Ortonyksja — założenie klamry tytanowej (220 zł) i jej przełożenie (180 zł)"
    - "Nieinwazyjne wyciszanie stanów zapalnych wałów bocznych"
    - "Profilaktyka nawrotów i instruktaż prawidłowego skracania paznokci"

- id: "pedicure-podologiczny"
  category: "Profilaktyka i pielęgnacja"
  title: "Pedicure podologiczny i pielęgnacyjny"
  price: "200 – 250 zł"
  summary: "Kompleksowe, bezbolesne opracowanie paznokci i podeszwy stóp z zachowaniem standardów higienicznych (autoklaw klasy B). Idealny zarówno profilaktycznie, jak i przy zmianach obciążeniowych."
  details:
    - "Pedicure pielęgnacyjny — opracowanie paznokci i usunięcie zrogowaceń (200 zł)"
    - "Pedicure podologiczny — pedicure pielęgnacyjny + usuwanie odcisków (250 zł)"
    - "Samodzielne obcięcie i opracowanie paznokci (130 zł)"
    - "Opcjonalnie w sezonie letnim na zdrowej płytce: lakier klasyczny (+20 zł) lub hybrydowy (+40 zł)"

- id: "paznokcie-pourazowe-chorobowe"
  category: "Terapia paznokci stóp i dłoni"
  title: "Paznokcie pourazowe, chorobowe i rekonstrukcja"
  price: "150 – 200 zł"
  summary: "Ukierunkowana terapia krwiaków, naderwań, grzybicy, onycholizy, dystrofii oraz onychogryfozy — zarówno na stopach, jak i na dłoniach. Możliwość estetycznej rekonstrukcji płytki."
  details:
    - "Terapia paznokci pourazowych (krwiaki, naderwania — również paznokcie dłoni)"
    - "Terapia paznokci chorobowych (grzybica, bakteria, onycholiza, onychogryfoza)"
    - "Rekonstrukcja płytki paznokciowej pozwalająca swobodnie cieszyć się latem (150 zł)"
    - "Plan regeneracji łożyska i celowana pielęgnacja domowa"

- id: "odciski-modzele"
  category: "Terapia skóry stóp"
  title: "Usuwanie odcisków i modzeli"
  price: "120 – 160 zł"
  summary: "Bezpieczne, gabinetowe usuwanie bolesnych czopów rogowych (odcisków) i modzeli — bez ryzyka oparzeń zdrowej skóry, jakie często powodują apteczne plastry z kwasem salicylowym."
  details:
    - "Usunięcie odcisków wraz z opatrunkiem i odciążeniem (130 – 160 zł)"
    - "Usunięcie modzeli i zrogowaceń obciążeniowych (120 – 150 zł)"
    - "Analiza przyczyn powstawania (obuwie, wady postawy, przeciążenia)"
    - "Wskazówki dotyczące odciążeń, wkładek i pielęgnacji zapobiegającej nawrotom"

- id: "pekajace-piety"
  category: "Terapia skóry stóp"
  title: "Terapia pękających pięt"
  price: "150 zł"
  summary: "Skuteczne oczyszczenie i maksymalne wypłycenie bolesnych pęknięć oraz rozpadlin piętowych. Pacjent schodzi z fotela bez bólu już po pierwszej wizycie."
  details:
    - "Bezpieczne opracowanie krawędzi rozpadlin bez agresywnego ścierania"
    - "Rozpoznanie przyczyn (przeciążenia, obuwie, hormony, tarczyca, cukrzyca)"
    - "Wprowadzenie regenerującej pielęgnacji domowej"
    - "Ochrona przed pogłębianiem się pęknięć i bolesnymi ranami"

- id: "brodawki-wirusowe"
  category: "Terapia skóry stóp"
  title: "Terapia brodawek wirusowych"
  price: "120 – 150 zł"
  summary: "Rzetelne różnicowanie brodawki wirusowej (HPV) od odcisku i bezpieczne, systematyczne prowadzenie terapii u dzieci oraz dorosłych."
  details:
    - "Dokładna diagnoza zapobiegająca błędnemu usuwaniu brodawek jako odcisków"
    - "Dobór skutecznej, kontrolowanej metody terapeutycznej"
    - "Ograniczenie ryzyka rozsiewania (mozaiki) i zarażania bliskich"
    - "Wsparcie zaleceń pielęgnacyjnych oraz odporności"

- id: "stopa-cukrzycowa"
  category: "Profilaktyka medyczna"
  title: "Profilaktyka stopy cukrzycowej"
  price: "wg konsultacji / zabiegu"
  summary: "Szczególnie uważna opieka dla diabetyków oraz wsparcie dla ich rodzin. U osób z cukrzycą nawet drobne otarcie lub pęknięcie wymaga fachowej kontroli podologicznej."
  details:
    - "Regularna kontrola stanu skóry, paznokci oraz potencjalnych miejsc ucisku"
    - "Delikatne, bezpieczne zabiegi dopasowane do wrażliwych stóp"
    - "Edukacja pacjenta i bliskich w zakresie codziennej obserwacji stóp i doboru obuwia"
    - "Wczesna reakcja chroniąca przed groźnymi powikłaniami"
