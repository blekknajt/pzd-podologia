# Prawdziwe przypadki kliniczne ze zdjęciami z materiałów PZD Podologia.
- title: "Onychogryfoza — siła trafnej diagnozy"
  duration: "3 miesiące terapii (VII–IX 2026)"
  tag: "Terapia paznokci"
  summary: "Młoda pacjentka po wielu wcześniejszych wizytach, które kończyły się wyłącznie maściami bez efektu. Właściwe rozpoznanie deformacji płytki, regularne oczyszczanie i sumienna pielęgnacja przyniosły widoczną poprawę już po pierwszym miesiącu."
  image: "/images/efekty/onychogryfoza.jpg"
  fit: "cover"

- title: "Rekonstrukcja płytki paznokciowej po urazie"
  duration: "Efekt na jednej wizycie"
  tag: "Rekonstrukcja"
  summary: "Wieloletnie uszkodzenia pourazowe nie muszą odbierać pewności siebie latem. Bezpieczna rekonstrukcja tworzy estetyczny paznokieć dopasowany kolorem i kształtem do pozostałych, a jesienią wracamy do pracy nad naturalnym odrostem."
  image: "/images/efekty/rekonstrukcja-paznokcia.jpg"
  fit: "contain"

- title: "Pękające pięty — komfort od pierwszej wizyty"
  duration: "Przed i bezpośrednio po zabiegu"
  tag: "Terapia skóry"
  summary: "Dokładne oczyszczenie i wypłycenie bolesnych pęknięć piętowych wraz z omówieniem ich przyczyn (przeciążenia, obuwie, przesuszenie, czynniki hormonalne) oraz wdrożeniem pielęgnacji regenerującej."
  image: "/images/efekty/pekajace-piety.jpg"
  fit: "cover"

- title: "Stan zapalny wału — nie zawsze potrzebna jest klamra"
  duration: "Terapia nieinwazyjna"
  tag: "Wały paznokciowe"
  summary: "Ból i zaczerwienienie wału okołopaznokciowego nie muszą od razu oznaczać ortonyksji. W tym przypadku odpowiednie opracowanie gabinetowe, profilaktyka i zalecenia domowe szybko wyciszyły stan zapalny bez zakładania klamry."
  image: "/images/efekty/stan-zapalny-walu.jpg"
  fit: "cover"

- title: "Paznokieć dłoni po urazie mechanicznym"
  duration: "5 tygodni terapii"
  tag: "Podologia dłoni"
  summary: "Podolog opiekuje się nie tylko stopami, ale także paznokciami dłoni po naderwaniach, złamaniach czy uszkodzeniach po stylizacji. Oczyszczenie płytki, celowany preparat i masaż opuszka wspierają prawidłowy odrost."
  image: "/images/efekty/paznokiec-dloni.jpg"
  fit: "cover"

- title: "Skuteczna terapia bolesnego odcisku"
  duration: "ok. 2 miesiące (wizyty co 3–4 tyg.)"
  tag: "Usuwanie odcisków"
  summary: "Połączenie delikatnego usuwania rdzenia odcisku w gabinecie z konsekwentną pielęgnacją domową i odciążeniem miejsca ucisku pozwoliło wypłycić zmianę i przywrócić zdrową, gładką skórę."
  image: "/images/efekty/odcisk-efekt.jpg"
  fit: "cover"
